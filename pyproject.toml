[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whest-starterkit"
version = "0.1.0"
description = "Starter kit for the ARC Whitebox Estimation Challenge"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flopscope>=0.12.0",
    "whestbench>=0.16.0",
]

[dependency-groups]
dev = [
    "flopscope-server==0.12.1",
    "httpx[socks]>=0.28.1",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
py-modules = ["estimator"]

[tool.ruff]
extend-exclude = ["archive", "experiments/moment_chain", "estimators/k3_v29", "estimators/k3_v25", "estimators/k3_v29_age3", "estimators/k3_v29_age5", "estimators/k3_v29_nofeed", "estimators/k3_v29_noconfine", "estimators/k3_v29_nowk431", "estimators/k3_v29_coreproxy", "estimators/k3_v29_coreproxy_first", "experiments/phase2/coreproxy_lambda_trace.py", "estimators/k3_v29_pairq3", "estimators/k3_v29_spilluse", "estimators/k3_v29_k4square", "estimators/k3_v29_tree4marg", "estimators/k3_v29_tree4last", "estimators/k3_v29_trianglelast", "estimators/k3_v29_doubleedge_final", "estimators/k3_v29_symrecursive"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
